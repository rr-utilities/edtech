<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdTech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #3b76cf;
            background-image: linear-gradient(180deg, #3061AB 0%, #3b76cf 25%);
            overflow: hidden;
            padding: 20px;
        }

        .error-container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .error-code {
            color: #a2d46b;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .error-title {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .error-message {
            color: rgba(255, 255, 255, 0.75);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .back-button {
            display: inline-block;
            text-decoration: none;
            background: linear-gradient(135deg, #a2d46b 0%, #85b057 100%);
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            padding: 14px 32px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(133, 176, 87, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(133, 176, 87, 0.45);
        }

        .back-button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-icon">🔍</div>
        
        <div class="error-code">Fehler 404</div>
        <h1 class="error-title">Seite nicht gefunden</h1>
        <p class="error-message">
            Das gesuchte Projekt oder die Seite existiert nicht mehr, wurde verschoben oder der Link ist fehlerhaft.
        </p>
        
        <a href="https://rr-utilities.github.io/edtech/" class="back-button">Zurück zu EdTech</a>
    </div>

</body>
</html>
